name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pydantic numpy trimesh shapely jinja2 networkx scipy PyQt6 pyqtgraph PyOpenGL pillow rtree pyinstaller
      - name: Icon
        run: python packaging/make_icon.py
      - name: Build
        run: pyinstaller packaging/ultima.spec --noconfirm
      - name: Smoke test (the program starts and builds the main window)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "import sys; sys.path.insert(0, '.'); from PyQt6.QtWidgets import QApplication; app = QApplication([]); from src.gui_app import MainWindow; MainWindow(); print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: ULTIMA-slicer-windows
          path: dist/ULTIMA-slicer.exe
